<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>节点监控 · 内置远程连接设计预览</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:760px;height:900px;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1f2937;background:linear-gradient(150deg,#e6eff9,#f4f6fa 56%,#dfe9f8);-webkit-font-smoothing:antialiased}.window{position:absolute;inset:26px 42px 30px;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.95);border-radius:22px;box-shadow:0 18px 45px rgba(43,64,92,.18),0 3px 10px rgba(43,64,92,.08);padding:29px 32px}.header{display:flex;align-items:center;gap:14px}.appicon{width:48px;height:48px;border-radius:14px;background:#e9f3ff;display:grid;place-items:center;color:#1380e6;flex:none}.title{font-size:21px;font-weight:650;letter-spacing:.3px}.subtitle{font-size:12px;color:#7f8a98;margin-top:4px}.preview{margin-left:auto;font-size:11px;color:#657891;background:#f1f5fa;border:1px solid #e5edf5;border-radius:14px;padding:5px 10px}.label{font-size:12px;font-weight:600;color:#738092;margin:23px 0 8px}.segmented{display:flex;padding:3px;background:#edf0f4;border-radius:10px;width:100%}.segmented span{height:32px;line-height:32px;text-align:center;width:50%;font-size:13px;font-weight:550;color:#728092}.segmented .selected{color:#1e293b;background:white;border-radius:8px;box-shadow:0 1px 4px #9eacbb4f}.hero{display:flex;align-items:center;gap:14px;padding:16px;margin-top:18px;background:linear-gradient(115deg,#edf6ff,#f4f9ff);border:1px solid #dfeeff;border-radius:14px}.shield{width:42px;height:42px;flex:none;background:#fff;border:1px solid #dfedfc;border-radius:12px;display:grid;place-items:center;color:#1681e8}.hero-title{font-weight:650;font-size:14px}.hero-desc{color:#708093;font-size:12px;margin-top:5px}.badge{margin-left:auto;white-space:nowrap;background:#dff4ec;color:#258565;font-size:11px;font-weight:600;padding:5px 8px;border-radius:15px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:21px 0 9px}.sectionhead b{font-size:13px}.hint{font-size:11px;color:#9aa4b2}.card{border:1px solid #e7ecf1;border-radius:13px;background:#fff;overflow:hidden}.row{display:flex;align-items:center;padding:14px 15px;gap:12px}.row+.row{border-top:1px solid #edf1f5}.device{width:36px;height:36px;display:grid;place-items:center;background:#f2f6fa;color:#607990;border-radius:10px;flex:none}.body{flex:1;min-width:0}.row-title{font-weight:600;font-size:13px}.row-desc{font-size:11px;color:#85909f;margin-top:4px}.status{display:inline-block;margin-left:6px;font-size:10px;color:#a5792e;font-weight:500;background:#fff5df;padding:3px 6px;border-radius:10px}.button{border:1px solid #d9e3ee;border-radius:8px;background:#fff;padding:7px 11px;font:600 11px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#356793;white-space:nowrap}.button.primary{background:#1678e8;border-color:#1678e8;color:#fff;box-shadow:0 2px 4px #78a7dc55}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field-name{font-size:11px;font-weight:600;color:#778494;margin-bottom:7px}.field-value{height:34px;display:flex;align-items:center;padding:0 10px;border:1px solid #e4eaf0;border-radius:8px;color:#a2adba;font-size:12px}.full{grid-column:1/3}.note{display:flex;gap:7px;align-items:flex-start;color:#7d8998;font-size:11px;line-height:1.5;margin-top:16px}.footer{display:flex;align-items:center;margin-top:18px;gap:9px}.footer a{font-size:11px;color:#5681ad}.footer .spacer{flex:1}.cancel{color:#657180;background:#f2f4f7;border-color:#f2f4f7}.disabled{color:#9bb8d8;background:#e5effa;border-color:#e5effa}svg{display:block}
</style>
</head>
<body>
<div class="window">
  <div class="header">
    <div class="appicon"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M3 15h18M7 6h.01M7 12h.01M7 18h.01M11 6h6M11 12h6M11 18h6"/></svg></div>
    <div><div class="title">添加服务器</div><div class="subtitle">随时查看服务器运行状态</div></div>
    <span class="preview">设计预览</span>
  </div>
  <div class="label">连接方式</div>
  <div class="segmented"><span>局域网连接</span><span class="selected">外网远程连接</span></div>
  <div class="hero">
    <div class="shield"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 20 5v6c0 5-3.4 8.4-8 11-4.6-2.6-8-6-8-11V5l8-3Z"/><path d="m8.5 12 2.3 2.4 4.8-5"/></svg></div>
    <div><div class="hero-title">远程连接已集成</div><div class="hero-desc">使用 Tailscale 加密网络，首次需要登录授权</div></div>
    <span class="badge">无需另装软件</span>
  </div>
  <div class="sectionhead"><b>连接准备</b><span class="hint">首次使用时完成一次</span></div>
  <div class="card">
    <div class="row">
      <div class="device"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="1.5"/><path d="M2 19h20M8 19h8"/></svg></div>
      <div class="body"><div class="row-title">这台 Mac <span class="status">待登录</span></div><div class="row-desc">在浏览器中登录并授权节点监控</div></div>
      <button class="button primary">登录并授权</button>
    </div>
    <div class="row">
      <div class="device"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M8 6h.01M8 12h.01M8 18h.01"/></svg></div>
      <div class="body"><div class="row-title">Ubuntu 服务器 <span class="status">待配置</span></div><div class="row-desc">采集端加入同一个 Tailscale 网络</div></div>
      <button class="button">查看配置步骤</button>
    </div>
  </div>
  <div class="sectionhead"><b>服务器信息</b><span class="hint">两端准备完成后填写</span></div>
  <div class="fields">
    <div><div class="field-name">服务器名称</div><div class="field-value">例如：Ubuntu 工作站</div></div>
    <div><div class="field-name">分组</div><div class="field-value">服务器</div></div>
    <div class="full"><div class="field-name">服务器的远程设备地址</div><div class="field-value">输入服务器的 Tailscale 名称或地址</div></div>
    <div class="full"><div class="field-name">访问令牌</div><div class="field-value">从服务器采集端获取</div></div>
  </div>
  <div class="note"><span>ⓘ</span><span>局域网连接使用内网地址；切换到远程连接后才使用内置加密网络。</span></div>
  <div class="footer"><a>远程连接说明</a><span class="spacer"></span><button class="button cancel">取消</button><button class="button disabled">添加并连接</button></div>
</div>
</body>
</html>
